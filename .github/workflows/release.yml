name: Release Portable EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза без префикса v (например 1.4.0 или 1.4.0-rc.1)"
        required: true
        type: string
      draft:
        description: "Создать релиз как черновик (Draft release)"
        required: true
        default: true
        type: boolean
      description:
        description: "Описание релиза (попадет в GitHub Release и release-info.json)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Resolve release version
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Workflow нужно запускать из ветки main."
          }

          $version = "${{ github.event.inputs.version }}".Trim()
          $semverPattern = '^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          if (-not ($version -match $semverPattern)) {
            throw "Некорректная версия: $version"
          }

          $tag = "v$version"

          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Тег $tag уже существует."
          }
          if ($LASTEXITCODE -ne 2) {
            throw "Не удалось проверить наличие тега $tag."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $version"
          Write-Host "Tag: $tag"

      - name: Create release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.meta.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "ZPRT App ${{ steps.meta.outputs.version }}"
          git push origin $tag

      - name: Apply release version to build files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.meta.outputs.version }}"

          $tauriConfigPath = "src-tauri/tauri.conf.json"
          $tauriConfig = Get-Content $tauriConfigPath -Raw | ConvertFrom-Json
          $tauriConfig.version = $version
          $tauriConfig | ConvertTo-Json -Depth 100 | Set-Content $tauriConfigPath -Encoding utf8

          npm version $version --no-git-tag-version --allow-same-version

          $cargoTomlPath = "src-tauri/Cargo.toml"
          $cargoToml = Get-Content $cargoTomlPath -Raw
          $cargoVersionPattern = [regex]'(?m)^(version\s*=\s*")[^"]+(")'
          $cargoToml = $cargoVersionPattern.Replace(
            $cargoToml,
            "`${1}$version`${2}",
            1
          )
          Set-Content $cargoTomlPath $cargoToml -Encoding utf8

          $cargoLockPath = "src-tauri/Cargo.lock"
          $cargoLock = Get-Content $cargoLockPath -Raw
          $appPackagePattern = [regex]'(?ms)(\[\[package\]\]\r?\nname = "zprt-app"\r?\nversion = ")[^"]+(")'
          $cargoLock = $appPackagePattern.Replace(
            $cargoLock,
            "`${1}$version`${2}",
            1
          )
          Set-Content $cargoLockPath $cargoLock -Encoding utf8

          $packageVersion = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $packageLock = Get-Content "package-lock.json" -Raw | ConvertFrom-Json -AsHashtable
          $packageLockVersion = $packageLock["version"]
          $packageLockRootVersion = $packageLock["packages"][""]["version"]
          $tauriVersion = (Get-Content $tauriConfigPath -Raw | ConvertFrom-Json).version
          $cargoVersion = (
            [regex]::Match((Get-Content $cargoTomlPath -Raw), '(?m)^version\s*=\s*"([^"]+)"')
          ).Groups[1].Value
          $cargoLockVersion = $appPackagePattern.Match(
            (Get-Content $cargoLockPath -Raw)
          ).Groups[0].Value -replace '(?s).*version = "([^"]+)".*', '$1'

          $resolvedVersions = @(
            $tauriVersion,
            $packageVersion,
            $packageLockVersion,
            $packageLockRootVersion,
            $cargoVersion,
            $cargoLockVersion
          ) | Select-Object -Unique

          if ($resolvedVersions.Count -ne 1 -or $resolvedVersions[0] -ne $version) {
            throw "Версии файлов сборки не синхронизированы: $($resolvedVersions -join ', ')"
          }

          Write-Host "Build files use version $version"

      - name: Build portable EXE (Tauri)
        run: npx tauri build --no-bundle

      - name: Prepare release assets
        id: assets
        shell: pwsh
        env:
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $releaseNotes = "$env:RELEASE_DESCRIPTION".Trim()
          $assetDir = "release-assets"
          $exeSource = "src-tauri\target\release\zprt-app.exe"
          $exeName = "zprt-app.exe"

          if (-not (Test-Path $exeSource)) {
            throw "Не найден файл $exeSource"
          }

          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          Copy-Item $exeSource (Join-Path $assetDir $exeName) -Force

          $exePath = Join-Path $assetDir $exeName
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()

          $downloadUrl = "https://github.com/$repo/releases/download/$tag/$exeName"
          $notesJson = $releaseNotes | ConvertTo-Json -Compress

          @"
          {
            "version": "$version",
            "url": "$downloadUrl",
            "sha256": "$hash",
            "notes": $notesJson
          }
          "@ | Set-Content -Path (Join-Path $assetDir "release-info.json") -Encoding utf8

          "$hash  *$exeName" | Set-Content -Path (Join-Path $assetDir "SHA256SUMS.txt") -Encoding ascii

          "asset_dir=$assetDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release (draft optional)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ZPRT App ${{ steps.meta.outputs.version }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          body: ${{ github.event.inputs.description }}
          generate_release_notes: ${{ github.event.inputs.description == '' }}
          files: |
            ${{ steps.assets.outputs.asset_dir }}/zprt-app.exe
            ${{ steps.assets.outputs.asset_dir }}/release-info.json
            ${{ steps.assets.outputs.asset_dir }}/SHA256SUMS.txt
